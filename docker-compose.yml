version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dns-shield-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/db:/app/app/db
      - ./backend/app/ml:/app/app/ml
      - ./backend/.keyfile:/app/.keyfile
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dns-shield-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
